---
- name: Verify mandatory filesystem archives contain no symlink or hardlink members
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import sys
        import tarfile

        for archive_path in sys.argv[1:]:
            with tarfile.open(archive_path, mode="r:*") as archive:
                link_count = sum(
                    1 for member in archive.getmembers()
                    if member.issym() or member.islnk()
                )
            if link_count:
                print(f"{archive_path}: contains {link_count} link member(s)", file=sys.stderr)
                raise SystemExit(23)
      - "{{ datev_skr04_backup_directory }}/kivitendo-installation.tar.gz"
      - "{{ datev_skr04_backup_directory }}/kivitendo-documents.tar.gz"
  environment:
    PYTHONPATH: ""
    PYTHONHOME: ""
    PYTHONSTARTUP: ""
    PYTHONINSPECT: "0"
  register: datev_skr04_snapshot_archive_link_audit
  changed_when: false

- name: Bind link-free archive evidence to snapshot finalization
  ansible.builtin.assert:
    that:
      - datev_skr04_snapshot_archive_link_audit.rc | int == 0
    fail_msg: >-
      A mandatory installation/document archive contains a symlink or hardlink
      member. The workflow does not treat link-only references to content outside
      the captured trees as complete recovery evidence; target creation remains
      blocked.

- name: Capture the actual snapshot-manifest finalization time
  ansible.builtin.command:
    argv:
      - date
      - --utc
      - +%Y-%m-%dT%H:%M:%SZ
  register: datev_skr04_snapshot_manifest_time
  changed_when: false

- name: Read the preliminary protected snapshot manifest
  ansible.builtin.slurp:
    src: "{{ datev_skr04_backup_directory }}/manifest.yml"
  register: datev_skr04_snapshot_manifest_preliminary

- name: Parse the preliminary snapshot manifest
  ansible.builtin.set_fact:
    datev_skr04_snapshot_manifest_preliminary_payload: >-
      {{ datev_skr04_snapshot_manifest_preliminary.content | b64decode | from_yaml }}

- name: Require the preliminary manifest to belong to this exact run
  ansible.builtin.assert:
    that:
      - datev_skr04_snapshot_manifest_preliminary_payload is mapping
      - datev_skr04_snapshot_manifest_preliminary_payload.version | int == 2
      - datev_skr04_snapshot_manifest_preliminary_payload.run_id == datev_skr04_run_id
      - datev_skr04_snapshot_manifest_preliminary_payload.source_database == datev_skr04_source_db
      - datev_skr04_snapshot_manifest_preliminary_payload.target_database == datev_skr04_target_db
      - datev_skr04_snapshot_manifest_preliminary_payload.source_fingerprint == datev_skr04_snapshot_fingerprint
      - datev_skr04_snapshot_manifest_preliminary_payload.local_files_snapshotted | bool
      - not (datev_skr04_snapshot_manifest_preliminary_payload.source_modified_by_workflow | bool)
    fail_msg: >-
      The preliminary snapshot manifest is malformed or does not belong to this
      exact source, target, fingerprint and migration run.

- name: Build the finalized snapshot manifest with an actual evidence timestamp
  ansible.builtin.set_fact:
    datev_skr04_snapshot_manifest_final_payload: >-
      {{
        datev_skr04_snapshot_manifest_preliminary_payload
        | combine(
            {
              'created_at': datev_skr04_snapshot_manifest_time.stdout,
              'evidence_finalized_at': datev_skr04_snapshot_manifest_time.stdout
            },
            recursive=True
          )
      }}

- name: Write the finalized manifest using YAML-safe serialization
  ansible.builtin.copy:
    dest: "{{ datev_skr04_backup_directory }}/manifest.yml"
    owner: postgres
    group: postgres
    mode: "0600"
    content: "{{ datev_skr04_snapshot_manifest_final_payload | to_nice_yaml(indent=2) }}"

- name: Read back the finalized snapshot manifest
  ansible.builtin.slurp:
    src: "{{ datev_skr04_backup_directory }}/manifest.yml"
  register: datev_skr04_snapshot_manifest_final_raw

- name: Parse the finalized snapshot manifest
  ansible.builtin.set_fact:
    datev_skr04_snapshot_manifest_final_verified: >-
      {{ datev_skr04_snapshot_manifest_final_raw.content | b64decode | from_yaml }}

- name: Prove the finalized snapshot evidence is parseable and time-accurate
  ansible.builtin.assert:
    that:
      - datev_skr04_snapshot_archive_link_audit.rc | int == 0
      - datev_skr04_snapshot_manifest_final_verified is mapping
      - datev_skr04_snapshot_manifest_final_verified.run_id == datev_skr04_run_id
      - datev_skr04_snapshot_manifest_final_verified.source_database == datev_skr04_source_db
      - datev_skr04_snapshot_manifest_final_verified.target_database == datev_skr04_target_db
      - datev_skr04_snapshot_manifest_final_verified.source_fingerprint == datev_skr04_snapshot_fingerprint
      - datev_skr04_snapshot_manifest_final_verified.created_at == datev_skr04_snapshot_manifest_time.stdout
      - datev_skr04_snapshot_manifest_final_verified.evidence_finalized_at == datev_skr04_snapshot_manifest_time.stdout
      - datev_skr04_snapshot_manifest_final_verified.source_dump_sha256 == datev_skr04_backup_checksums.results[0].stat.checksum
      - datev_skr04_snapshot_manifest_final_verified.auth_dump_sha256 == datev_skr04_backup_checksums.results[1].stat.checksum
      - datev_skr04_snapshot_manifest_final_verified.kivitendo_installation_archive_sha256 == datev_skr04_local_backup_checksums.results[0].stat.checksum
      - datev_skr04_snapshot_manifest_final_verified.kivitendo_documents_archive_sha256 == datev_skr04_local_backup_checksums.results[1].stat.checksum
    fail_msg: >-
      The finalized snapshot manifest is malformed, carries a stale timestamp,
      contains link-only filesystem evidence or no longer matches the mandatory
      recovery artifacts.
