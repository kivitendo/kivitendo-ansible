---
- name: Validate identifiers required for PostgreSQL cluster binding
  ansible.builtin.assert:
    that:
      - datev_skr04_source_db is match('^[a-z][a-z0-9_]{2,62}$')
      - datev_skr04_target_db is match('^[a-z][a-z0-9_]{2,62}$')
      - datev_skr04_auth_db is match('^[a-z][a-z0-9_]{2,62}$')
      - datev_skr04_db_user is match('^[A-Za-z_][A-Za-z0-9_.-]{0,62}$')
      - datev_skr04_source_db != datev_skr04_target_db
      - datev_skr04_db_host == '127.0.0.1'
      - (datev_skr04_db_port | string) is match('^[0-9]{1,5}$')
      - datev_skr04_db_port | int > 0
      - datev_skr04_db_port | int <= 65535
      - datev_skr04_cluster_contract_phase | default('preflight') in ['preflight', 'pre_snapshot', 'pre_create']
    fail_msg: >-
      PostgreSQL cluster binding requires validated source, target, auth, role,
      host, port and phase identifiers before any connection is attempted.

- name: Read the live kivitendo database password when no protected override was supplied
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import configparser
        import pathlib
        import sys

        path = pathlib.Path(sys.argv[1])
        parser = configparser.RawConfigParser(strict=False)
        with path.open("r", encoding="utf-8") as handle:
            parser.read_file(handle)
        value = parser.get("authentication/database", "password", fallback="")
        if not value:
            raise SystemExit("live kivitendo database password is missing")
        if "\n" in value or "\r" in value:
            raise SystemExit("live kivitendo database password contains a newline")
        sys.stdout.write(value)
      - "{{ kivitendo_install_dir }}/config/kivitendo.conf"
  register: datev_skr04_cluster_live_db_password
  changed_when: false
  when: datev_skr04_db_password | length == 0
  no_log: true

- name: Keep the protected database password only in the current Ansible process
  ansible.builtin.set_fact:
    datev_skr04_effective_db_password: >-
      {{
        datev_skr04_db_password
        if datev_skr04_db_password | length > 0
        else datev_skr04_cluster_live_db_password.stdout
      }}
  no_log: true

- name: Read the explicit Unix-socket PostgreSQL cluster identity as local superuser
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    login_port: "{{ datev_skr04_db_port }}"
    login_db: postgres
    query: |
      SELECT
        (pg_control_system()).system_identifier::text AS system_identifier,
        current_setting('port')::integer AS server_port,
        current_database() AS database_name,
        current_user AS session_user,
        EXISTS (
          SELECT 1 FROM pg_database WHERE datname = %(source_db)s
        ) AS source_exists,
        EXISTS (
          SELECT 1 FROM pg_database WHERE datname = %(auth_db)s
        ) AS auth_exists,
        EXISTS (
          SELECT 1 FROM pg_database WHERE datname = %(target_db)s
        ) AS target_exists;
    named_args:
      source_db: "{{ datev_skr04_source_db }}"
      auth_db: "{{ datev_skr04_auth_db }}"
      target_db: "{{ datev_skr04_target_db }}"
  register: datev_skr04_socket_cluster_identity
  changed_when: false
  no_log: true

- name: Read the configured TCP PostgreSQL cluster identity as the application role
  community.postgresql.postgresql_query:
    login_host: "{{ datev_skr04_db_host }}"
    login_port: "{{ datev_skr04_db_port }}"
    login_db: "{{ datev_skr04_source_db }}"
    login_user: "{{ datev_skr04_db_user }}"
    login_password: "{{ datev_skr04_effective_db_password }}"
    query: |
      SELECT
        (pg_control_system()).system_identifier::text AS system_identifier,
        current_setting('port')::integer AS server_port,
        current_database() AS database_name,
        current_user AS session_user,
        inet_server_addr()::text AS server_address,
        inet_server_port()::integer AS accepted_port,
        has_function_privilege(
          current_user,
          'pg_catalog.pg_control_system()',
          'EXECUTE'
        ) AS may_read_cluster_identity;
  register: datev_skr04_tcp_cluster_identity
  changed_when: false
  no_log: true

- name: Assert socket and TCP resolve to the exact same PostgreSQL cluster
  ansible.builtin.assert:
    that:
      - datev_skr04_socket_cluster_identity.query_result | length == 1
      - datev_skr04_tcp_cluster_identity.query_result | length == 1
      - datev_skr04_socket_cluster_identity.query_result[0].system_identifier is match('^[0-9]+$')
      - datev_skr04_tcp_cluster_identity.query_result[0].system_identifier == datev_skr04_socket_cluster_identity.query_result[0].system_identifier
      - datev_skr04_socket_cluster_identity.query_result[0].server_port | int == datev_skr04_db_port | int
      - datev_skr04_tcp_cluster_identity.query_result[0].server_port | int == datev_skr04_db_port | int
      - datev_skr04_tcp_cluster_identity.query_result[0].accepted_port | int == datev_skr04_db_port | int
      - datev_skr04_tcp_cluster_identity.query_result[0].server_address == datev_skr04_db_host
      - datev_skr04_tcp_cluster_identity.query_result[0].database_name == datev_skr04_source_db
      - datev_skr04_tcp_cluster_identity.query_result[0].session_user == datev_skr04_db_user
      - datev_skr04_tcp_cluster_identity.query_result[0].may_read_cluster_identity | bool
      - datev_skr04_socket_cluster_identity.query_result[0].source_exists | bool
      - datev_skr04_socket_cluster_identity.query_result[0].auth_exists | bool
      - not (datev_skr04_socket_cluster_identity.query_result[0].target_exists | bool)
      - >-
        datev_skr04_bound_system_identifier | default(
          datev_skr04_socket_cluster_identity.query_result[0].system_identifier,
          true
        ) == datev_skr04_socket_cluster_identity.query_result[0].system_identifier
    fail_msg: >-
      Explicit Unix-socket inspection/backups and configured 127.0.0.1
      application connections do not identify the same PostgreSQL system,
      port, source database and role. No snapshot or target operation is
      permitted.
  no_log: true

- name: Bind the verified PostgreSQL system identifier to this migration run
  ansible.builtin.set_fact:
    datev_skr04_bound_system_identifier: >-
      {{ datev_skr04_socket_cluster_identity.query_result[0].system_identifier }}
    datev_skr04_cluster_contract:
      verified: true
      phase: "{{ datev_skr04_cluster_contract_phase | default('preflight') }}"
      system_identifier: >-
        {{ datev_skr04_socket_cluster_identity.query_result[0].system_identifier }}
      host: "{{ datev_skr04_db_host }}"
      port: "{{ datev_skr04_db_port | string }}"
      source_database: "{{ datev_skr04_source_db }}"
      auth_database: "{{ datev_skr04_auth_db }}"
      database_role: "{{ datev_skr04_db_user }}"
  no_log: true
