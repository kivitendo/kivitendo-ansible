---
- name: Validate backend runtime-restore inputs
  ansible.builtin.assert:
    that:
      - datev_skr04_backend_units_to_mask is defined
      - datev_skr04_backend_restore_items is defined
      - datev_skr04_backend_context is defined
      - datev_skr04_backend_masked_units is defined
    fail_msg: >-
      Backend runtime-restore inputs are incomplete. Refusing to reopen the web
      frontend without an explicit backend recovery and mask-ownership contract.

- name: Initialize backend recovery state and deferred mask ownership
  ansible.builtin.set_fact:
    datev_skr04_backend_unmask_ok: true
    datev_skr04_backend_expected_state_ok: true
    datev_skr04_backend_reseal_ok: true
    datev_skr04_backend_immediate_unmask_units: []
    datev_skr04_backend_deferred_unmask_units: []

- name: Partition migration-owned backend masks by authoritative entry state
  ansible.builtin.set_fact:
    datev_skr04_backend_immediate_unmask_units: >-
      {{
        datev_skr04_backend_immediate_unmask_units +
        ([item.unit] if (item.was_running | bool) and item.unit in datev_skr04_backend_masked_units else [])
      }}
    datev_skr04_backend_deferred_unmask_units: >-
      {{
        datev_skr04_backend_deferred_unmask_units +
        ([item.unit] if not (item.was_running | bool) and item.unit in datev_skr04_backend_masked_units else [])
      }}
  loop: "{{ datev_skr04_backend_restore_items }}"

- name: Remove migration masks only from entry-running backends before web recovery
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - unmask
      - --runtime
      - "{{ item }}"
  loop: "{{ datev_skr04_backend_immediate_unmask_units }}"
  register: datev_skr04_backend_unmask_attempts
  changed_when: true
  failed_when: false

- name: Record any backend runtime-unmask failure
  ansible.builtin.set_fact:
    datev_skr04_backend_unmask_ok: false
  loop: "{{ datev_skr04_backend_unmask_attempts.results | default([]) }}"
  when:
    - item.rc is defined
    - item.rc | int != 0

- name: Attempt restoration only for backends running at authoritative window entry
  ansible.builtin.service:
    name: "{{ item.unit }}"
    state: started
  loop: "{{ datev_skr04_backend_restore_items }}"
  register: datev_skr04_backend_start_attempts
  failed_when: false
  when:
    - datev_skr04_backend_unmask_ok | bool
    - item.was_running | bool

- name: Re-read backend states before web restoration
  ansible.builtin.service_facts:

- name: Record any backend service state that differs from authoritative entry
  ansible.builtin.set_fact:
    datev_skr04_backend_expected_state_ok: false
  loop: "{{ datev_skr04_backend_restore_items }}"
  when: >-
    (
      (item.was_running | bool) and
      ansible_facts.services.get(item.unit, {}).get('state', '') != 'running'
    ) or
    (
      not (item.was_running | bool) and
      ansible_facts.services.get(item.unit, {}).get('state', '') == 'running'
    )

- name: Verify deferred entry-stopped backend masks remain active before web restoration
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-enabled
      - "{{ item }}"
  loop: "{{ datev_skr04_backend_deferred_unmask_units }}"
  register: datev_skr04_backend_deferred_mask_verification
  changed_when: false
  failed_when: false

- name: Record any lost deferred backend mask before web restoration
  ansible.builtin.set_fact:
    datev_skr04_backend_expected_state_ok: false
  loop: "{{ datev_skr04_backend_deferred_mask_verification.results | default([]) }}"
  when:
    - (item.stdout | default('') | trim) not in ['masked', 'masked-runtime']

- name: Bind whether pre-web backend recovery must be resealed
  ansible.builtin.set_fact:
    datev_skr04_backend_reseal_required: >-
      {{
        not (datev_skr04_backend_unmask_ok | bool) or
        not (datev_skr04_backend_expected_state_ok | bool)
      }}

- name: Reseal every migration-owned backend after any pre-web recovery violation
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - mask
      - --runtime
      - --now
      - "{{ item }}"
  loop: "{{ datev_skr04_backend_masked_units | default([]) }}"
  register: datev_skr04_backend_reseal_attempts
  changed_when: true
  failed_when: false
  when: datev_skr04_backend_reseal_required | bool

- name: Record any backend reseal command failure
  ansible.builtin.set_fact:
    datev_skr04_backend_reseal_ok: false
  loop: "{{ datev_skr04_backend_reseal_attempts.results | default([]) }}"
  when:
    - item.rc is defined
    - item.rc | int != 0

- name: Verify migration-owned backend runtime masks after pre-web fail-closed reseal
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-enabled
      - "{{ item }}"
  loop: "{{ datev_skr04_backend_masked_units | default([]) }}"
  register: datev_skr04_backend_reseal_verification
  changed_when: false
  failed_when: false
  when: datev_skr04_backend_reseal_required | bool

- name: Record any incomplete backend runtime reseal
  ansible.builtin.set_fact:
    datev_skr04_backend_reseal_ok: false
  loop: "{{ datev_skr04_backend_reseal_verification.results | default([]) }}"
  when:
    - item.stdout is defined
    - (item.stdout | trim) not in ['masked', 'masked-runtime']

- name: Re-read backend states after pre-web fail-closed reseal
  ansible.builtin.service_facts:
  when: datev_skr04_backend_reseal_required | bool

- name: Record any running migration-owned backend after pre-web fail-closed reseal
  ansible.builtin.set_fact:
    datev_skr04_backend_reseal_ok: false
  loop: "{{ datev_skr04_backend_masked_units | default([]) }}"
  when:
    - datev_skr04_backend_reseal_required | bool
    - ansible_facts.services.get(item, {}).get('state', '') == 'running'

- name: Bind successful pre-web authoritative backend recovery
  ansible.builtin.set_fact:
    datev_skr04_backend_restore_ready: >-
      {{
        (datev_skr04_backend_unmask_ok | bool) and
        (datev_skr04_backend_expected_state_ok | bool) and
        not (datev_skr04_backend_reseal_required | bool)
      }}
