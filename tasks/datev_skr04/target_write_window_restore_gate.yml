---
- name: Re-read service state after target-window restoration attempts
  ansible.builtin.service_facts:

- name: Fail only after backend and frontend restoration handling completed
  ansible.builtin.assert:
    that:
      - datev_skr04_target_window_backends_ready | default(false) | bool
      - >-
        not (datev_skr04_web_service_was_running | default(false) | bool) or
        (
          datev_skr04_web_restore_allowed | default(false) | bool and
          not (datev_skr04_web_service_restore_attempt.failed | default(false) | bool) and
          ansible_facts.services.get(datev_skr04_web_service_unit, {}).get('state', '') == 'running'
        )
      - >-
        datev_skr04_other_web_service_unit not in ansible_facts.services or
        ansible_facts.services[datev_skr04_other_web_service_unit].state != 'running'
      - >-
        not (datev_skr04_target_window_fcgi_was_running | default(false) | bool) or
        ansible_facts.services.get(datev_skr04_target_window_fcgi_service_name + '.service', {}).get('state', '') == 'running'
      - >-
        not (datev_skr04_target_window_task_was_running | default(false) | bool) or
        ansible_facts.services.get(datev_skr04_target_window_task_service_name + '.service', {}).get('state', '') == 'running'
      - >-
        not (datev_skr04_target_window_apache_was_running | default(false) | bool) or
        ansible_facts.services.get('apache2.service', {}).get('state', '') == 'running'
    fail_msg: >-
      One or more services that were running before the target-write freeze could
      not be restored safely. Backend restoration was attempted first; the HTTP
      frontend is reopened only when its required backends are healthy. Keep the
      frontend closed and complete production service recovery before any further
      migration action.
