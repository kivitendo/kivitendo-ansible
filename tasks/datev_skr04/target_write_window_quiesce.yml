---
- name: Require target backend entry state before quiescing
  ansible.builtin.assert:
    that:
      - datev_skr04_target_window_fcgi_service_name is defined
      - datev_skr04_target_window_task_service_name is defined
      - datev_skr04_target_window_fcgi_was_running is defined
      - datev_skr04_target_window_task_was_running is defined
    fail_msg: >-
      Target-window backend entry state was not captured before the selected HTTP
      frontend was stopped. Refusing to infer restoration state after service
      dependencies may already have changed it.

- name: Stop dedicated kivitendo FCGI for the target-write freeze
  ansible.builtin.service:
    name: "{{ datev_skr04_target_window_fcgi_service_name }}"
    state: stopped
  when: datev_skr04_target_window_fcgi_was_running | bool

- name: Stop kivitendo task server for the target-write freeze
  ansible.builtin.service:
    name: "{{ datev_skr04_target_window_task_service_name }}"
    state: stopped
  when: datev_skr04_target_window_task_was_running | bool

- name: Confirm write-capable backend services are stopped for the target window
  ansible.builtin.service_facts:

- name: Require all target-entry backends to remain stopped
  ansible.builtin.assert:
    that:
      - >-
        not (datev_skr04_target_window_fcgi_was_running | bool) or
        ansible_facts.services.get(datev_skr04_target_window_fcgi_service_name + '.service', {}).get('state', '') != 'running'
      - >-
        not (datev_skr04_target_window_task_was_running | bool) or
        ansible_facts.services.get(datev_skr04_target_window_task_service_name + '.service', {}).get('state', '') != 'running'
    fail_msg: >-
      A backend that was running at target-window entry could not be quiesced.
      Source boundary/fingerprint revalidation and all target writes are blocked.
