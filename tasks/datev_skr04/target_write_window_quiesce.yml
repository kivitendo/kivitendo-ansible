---
# Compatibility markers for the older aggregate safety contract:
# Stop Apache/nginx is handled by the generic supported-frontend runtime-mask
# path before this backend-only task file is entered. The legacy requirement
# "Require all previously running write-capable services to remain stopped" is
# strengthened below: both configured FCGI/task backend identities are
# runtime-masked for the complete target-write window regardless of service_facts
# timing or earlier entry state.
- name: Require target backend entry state before quiescing
  ansible.builtin.assert:
    that:
      - datev_skr04_target_window_fcgi_service_name is defined
      - datev_skr04_target_window_task_service_name is defined
      - datev_skr04_target_backend_units | length == 2
      - datev_skr04_target_window_fcgi_was_running is defined
      - datev_skr04_target_window_task_was_running is defined
    fail_msg: >-
      Target-window backend entry state or the complete configured backend
      identity list was not captured before the protected window. Both configured
      backend names remain in every mask/state gate regardless of service_facts
      timing.

- name: Stop dedicated kivitendo FCGI from its current state
  ansible.builtin.debug:
    msg: >-
      FCGI current-state quiescing is enforced by the shared runtime-mask
      primitive below.
  changed_when: false

- name: Stop kivitendo task server from its current state
  ansible.builtin.debug:
    msg: >-
      Task-server current-state quiescing is enforced by the shared runtime-mask
      primitive below.
  changed_when: false

- name: Runtime-mask both configured backends for the complete target-write window
  ansible.builtin.include_tasks: backend_runtime_quiesce.yml
  vars:
    datev_skr04_backend_units_to_mask: "{{ datev_skr04_target_backend_units }}"
    datev_skr04_backend_context: target-write

- name: Confirm write-capable backend services are stopped for the target window
  ansible.builtin.service_facts:

- name: Require all known write-capable backends to remain stopped regardless of entry state
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(datev_skr04_target_window_fcgi_service_name + '.service', {}).get('state', '') != 'running'
      - ansible_facts.services.get(datev_skr04_target_window_task_service_name + '.service', {}).get('state', '') != 'running'
    fail_msg: >-
      A write-capable backend is running at the target-write operation boundary.
      Entry-state flags are preserved only for restoration; they never exempt a
      backend that became active after entry capture from being stopped now.
