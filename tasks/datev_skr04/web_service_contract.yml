---
- name: Validate the explicitly configured kivitendo web service
  ansible.builtin.assert:
    that:
      - datev_skr04_web_service_name in ['apache2', 'nginx']
    fail_msg: >-
      datev_skr04_web_service_name must explicitly identify the write-capable
      kivitendo HTTP frontend. Supported values are apache2 and nginx.

- name: Read service state for the supported kivitendo web frontends
  ansible.builtin.service_facts:

- name: Bind the selected and alternate supported web frontend units
  ansible.builtin.set_fact:
    datev_skr04_web_service_unit: "{{ datev_skr04_web_service_name }}.service"
    datev_skr04_other_web_service_name: >-
      {{ 'nginx' if datev_skr04_web_service_name == 'apache2' else 'apache2' }}
    datev_skr04_other_web_service_unit: >-
      {{ ('nginx' if datev_skr04_web_service_name == 'apache2' else 'apache2') + '.service' }}

- name: Read selected web frontend enablement and mask state
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-enabled
      - "{{ datev_skr04_web_service_unit }}"
  register: datev_skr04_selected_web_enablement
  changed_when: false
  failed_when: false

- name: Require exactly one supported running and restartable kivitendo web frontend
  ansible.builtin.assert:
    that:
      - datev_skr04_web_service_unit in ansible_facts.services
      - ansible_facts.services[datev_skr04_web_service_unit].state == 'running'
      - (datev_skr04_selected_web_enablement.stdout | trim) not in ['masked', 'masked-runtime']
      - >-
        datev_skr04_other_web_service_unit not in ansible_facts.services or
        ansible_facts.services[datev_skr04_other_web_service_unit].state != 'running'
    fail_msg: >-
      The configured kivitendo web frontend must exist, be running and not be
      persistently/runtime masked, while the other supported frontend must not
      be running. A running-but-masked frontend is rejected because the migration
      could stop it successfully but could not guarantee restoration afterward.
