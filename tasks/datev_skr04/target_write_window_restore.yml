---
- name: Attempt FCGI restoration after target-write window
  ansible.builtin.service:
    name: "{{ datev_skr04_target_window_fcgi_service_name }}"
    state: started
  register: datev_skr04_target_window_fcgi_restore
  failed_when: false
  when: datev_skr04_target_window_fcgi_was_running | default(false) | bool

- name: Attempt task-server restoration after target-write window
  ansible.builtin.service:
    name: "{{ datev_skr04_target_window_task_service_name }}"
    state: started
  register: datev_skr04_target_window_task_restore
  failed_when: false
  when: datev_skr04_target_window_task_was_running | default(false) | bool

# Kept for backwards compatibility with repository-managed Apache deployments.
# If apache2 is the explicitly selected web frontend, it was already stopped
# before target_write_window_quiesce.yml captured its legacy state, so this is a
# no-op and the generic frontend restore runs after backend restoration.
- name: Attempt legacy Apache restoration after target-write window
  ansible.builtin.service:
    name: apache2
    state: started
  register: datev_skr04_target_window_apache_restore
  failed_when: false
  when: datev_skr04_target_window_apache_was_running | default(false) | bool

- name: Re-read backend service state after all backend restoration attempts
  ansible.builtin.service_facts:

- name: Record whether all required backend services are restored
  ansible.builtin.set_fact:
    datev_skr04_target_window_backends_ready: >-
      {{
        (
          not (datev_skr04_target_window_fcgi_was_running | default(false) | bool) or
          (
            not (datev_skr04_target_window_fcgi_restore.failed | default(false) | bool) and
            ansible_facts.services.get(datev_skr04_target_window_fcgi_service_name + '.service', {}).get('state', '') == 'running'
          )
        ) and
        (
          not (datev_skr04_target_window_task_was_running | default(false) | bool) or
          (
            not (datev_skr04_target_window_task_restore.failed | default(false) | bool) and
            ansible_facts.services.get(datev_skr04_target_window_task_service_name + '.service', {}).get('state', '') == 'running'
          )
        ) and
        (
          not (datev_skr04_target_window_apache_was_running | default(false) | bool) or
          (
            not (datev_skr04_target_window_apache_restore.failed | default(false) | bool) and
            ansible_facts.services.get('apache2.service', {}).get('state', '') == 'running'
          )
        )
      }}
