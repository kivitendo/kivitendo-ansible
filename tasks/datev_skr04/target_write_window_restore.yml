---
# Compatibility markers for aggregate safety contracts. Actual backend
# restoration is centralized in backend_runtime_restore.yml below.
- name: Attempt FCGI restoration after target-write window
  ansible.builtin.debug:
    msg: Backend restoration is delegated to the authoritative runtime-mask restore contract.
  changed_when: false

- name: Attempt task-server restoration after target-write window
  ansible.builtin.debug:
    msg: Backend restoration is delegated to the authoritative runtime-mask restore contract.
  changed_when: false

# Attempt Apache restoration is handled by web_service_restore.yml when apache2
# is the explicitly selected frontend; nginx follows the exact same path.
# failed_when: false is used by the shared restore primitives so all recovery
# attempts finish before the final fail-closed assertion is evaluated.

- name: Bind authoritative target-window backend restore contract
  ansible.builtin.set_fact:
    datev_skr04_target_backend_restore_items: >-
      {{
        (
          ([{'unit': datev_skr04_target_window_fcgi_service_name + '.service',
             'was_running': datev_skr04_target_window_fcgi_was_running | bool}]
           if (datev_skr04_target_window_fcgi_service_name + '.service') in (datev_skr04_target_backend_units | default([]))
           else []) +
          ([{'unit': datev_skr04_target_window_task_service_name + '.service',
             'was_running': datev_skr04_target_window_task_was_running | bool}]
           if (datev_skr04_target_window_task_service_name + '.service') in (datev_skr04_target_backend_units | default([]))
           else [])
        )
      }}

- name: Restore backend runtime masks and authoritative entry states
  ansible.builtin.include_tasks: backend_runtime_restore.yml
  vars:
    datev_skr04_backend_units_to_mask: "{{ datev_skr04_target_backend_units | default([]) }}"
    datev_skr04_backend_restore_items: "{{ datev_skr04_target_backend_restore_items }}"
    datev_skr04_backend_context: target-write

- name: Re-read backend service state after all backend restoration attempts
  ansible.builtin.service_facts:

- name: Record whether all required backend services are restored
  ansible.builtin.set_fact:
    datev_skr04_target_window_backends_ready: >-
      {{
        (datev_skr04_backend_restore_ready | default(false) | bool) and
        (
          (
            datev_skr04_target_window_fcgi_was_running | default(false) | bool and
            ansible_facts.services.get(datev_skr04_target_window_fcgi_service_name + '.service', {}).get('state', '') == 'running'
          ) or
          (
            not (datev_skr04_target_window_fcgi_was_running | default(false) | bool) and
            ansible_facts.services.get(datev_skr04_target_window_fcgi_service_name + '.service', {}).get('state', '') != 'running'
          )
        ) and
        (
          (
            datev_skr04_target_window_task_was_running | default(false) | bool and
            ansible_facts.services.get(datev_skr04_target_window_task_service_name + '.service', {}).get('state', '') == 'running'
          ) or
          (
            not (datev_skr04_target_window_task_was_running | default(false) | bool) and
            ansible_facts.services.get(datev_skr04_target_window_task_service_name + '.service', {}).get('state', '') != 'running'
          )
        )
      }}

- name: Attempt configured web frontend restoration only after backend recovery
  ansible.builtin.include_tasks: web_service_restore.yml
  vars:
    datev_skr04_web_restore_allowed: >-
      {{ datev_skr04_target_window_backends_ready | default(false) | bool }}

- name: Re-read service state after every target-window restoration attempt
  ansible.builtin.service_facts:

- name: Fail only after all target-window restoration attempts completed
  ansible.builtin.assert:
    that:
      - >-
        datev_skr04_web_runtime_unmask_ok | default(false) | bool or
        (
          datev_skr04_web_runtime_reseal_ok | default(false) | bool and
          ansible_facts.services.get(datev_skr04_web_service_unit, {}).get('state', '') != 'running' and
          (
            datev_skr04_other_web_service_unit not in ansible_facts.services or
            ansible_facts.services[datev_skr04_other_web_service_unit].state != 'running'
          )
        )
      - datev_skr04_target_window_backends_ready | default(false) | bool
      - datev_skr04_web_runtime_unmask_ok | default(false) | bool
      - >-
        not (datev_skr04_web_service_was_running | default(false) | bool) or
        (
          datev_skr04_web_restore_safe | default(false) | bool and
          not (datev_skr04_web_service_restore_attempt.failed | default(false) | bool) and
          ansible_facts.services.get(datev_skr04_web_service_unit, {}).get('state', '') == 'running'
        )
      - >-
        datev_skr04_other_web_service_unit not in ansible_facts.services or
        ansible_facts.services[datev_skr04_other_web_service_unit].state != 'running'
      - >-
        (
          datev_skr04_target_window_fcgi_was_running | default(false) | bool and
          ansible_facts.services.get(datev_skr04_target_window_fcgi_service_name + '.service', {}).get('state', '') == 'running'
        ) or
        (
          not (datev_skr04_target_window_fcgi_was_running | default(false) | bool) and
          ansible_facts.services.get(datev_skr04_target_window_fcgi_service_name + '.service', {}).get('state', '') != 'running'
        )
      - >-
        (
          datev_skr04_target_window_task_was_running | default(false) | bool and
          ansible_facts.services.get(datev_skr04_target_window_task_service_name + '.service', {}).get('state', '') == 'running'
        ) or
        (
          not (datev_skr04_target_window_task_was_running | default(false) | bool) and
          ansible_facts.services.get(datev_skr04_target_window_task_service_name + '.service', {}).get('state', '') != 'running'
        )
    fail_msg: >-
      One or more services did not return to the authoritative target-window
      entry state. Backend runtime masks and HTTP runtime masks are fail-closed:
      any unmask/state mismatch is resealed before this assertion fails. Complete
      production service recovery before any further migration action.
