---
- name: Reset configured web frontend restore state for this window
  ansible.builtin.set_fact:
    datev_skr04_web_service_was_running: false

- name: Re-read supported web frontend state before quiescing
  ansible.builtin.service_facts:

- name: Require a single supported running web frontend before quiescing
  ansible.builtin.assert:
    that:
      - datev_skr04_web_service_unit in ansible_facts.services
      - ansible_facts.services[datev_skr04_web_service_unit].state == 'running'
      - >-
        datev_skr04_other_web_service_unit not in ansible_facts.services or
        ansible_facts.services[datev_skr04_other_web_service_unit].state != 'running'
    fail_msg: >-
      The selected kivitendo web frontend must be the only supported running
      frontend at the start of a protected quiesce window. Refusing to continue
      while another supported HTTP write path is active. The restore flag was
      reset before this validation, so a failed window cannot start a service
      that was not accepted as running on entry.

- name: Remember that the configured web frontend must be restored
  ansible.builtin.set_fact:
    datev_skr04_web_service_was_running: true

- name: Stop the configured kivitendo web frontend
  ansible.builtin.service:
    name: "{{ datev_skr04_web_service_name }}"
    state: stopped

- name: Confirm supported web frontends are quiesced
  ansible.builtin.service_facts:

- name: Require all supported web frontend write paths to remain quiesced
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(datev_skr04_web_service_unit, {}).get('state', '') != 'running'
      - >-
        datev_skr04_other_web_service_unit not in ansible_facts.services or
        ansible_facts.services[datev_skr04_other_web_service_unit].state != 'running'
    fail_msg: >-
      A supported kivitendo web frontend remains active after quiescing. No
      protected snapshot or target-write operation is allowed while an HTTP
      write path can still accept traffic.
