---
- name: Require snapshot backend entry state before quiescing
  ansible.builtin.assert:
    that:
      - datev_skr04_snapshot_fcgi_service_name is defined
      - datev_skr04_snapshot_task_service_name is defined
      - datev_skr04_snapshot_fcgi_was_running_at_entry is defined
      - datev_skr04_snapshot_task_was_running_at_entry is defined
    fail_msg: >-
      Snapshot backend entry state was not captured before the HTTP frontend was
      quiesced. Entry flags are restoration metadata only and never exempt a
      backend from the protected-window runtime mask.

- name: Re-read backend state immediately before snapshot quiescing
  ansible.builtin.service_facts:

- name: Bind every installed snapshot backend unit from current service state
  ansible.builtin.set_fact:
    datev_skr04_snapshot_backend_units: >-
      {{
        (
          ([datev_skr04_snapshot_fcgi_service_name + '.service']
           if (datev_skr04_snapshot_fcgi_service_name + '.service') in ansible_facts.services
           else []) +
          ([datev_skr04_snapshot_task_service_name + '.service']
           if (datev_skr04_snapshot_task_service_name + '.service') in ansible_facts.services
           else [])
        ) | unique | list
      }}

- name: Runtime-mask every current snapshot backend for the complete protected window
  ansible.builtin.include_tasks: backend_runtime_quiesce.yml
  vars:
    datev_skr04_backend_units_to_mask: "{{ datev_skr04_snapshot_backend_units }}"
    datev_skr04_backend_context: snapshot
