---
- name: Require snapshot backend entry state before quiescing
  ansible.builtin.assert:
    that:
      - datev_skr04_snapshot_fcgi_service_name is defined
      - datev_skr04_snapshot_task_service_name is defined
      - datev_skr04_snapshot_fcgi_was_running_at_entry is defined
      - datev_skr04_snapshot_task_was_running_at_entry is defined
    fail_msg: >-
      Snapshot backend entry state was not captured before the HTTP frontend was
      quiesced. Entry flags are required only to restore the original service
      state after the protected window.

- name: Re-read backend state immediately before snapshot quiescing
  ansible.builtin.service_facts:

- name: Stop the FCGI backend from its current state before snapshotting
  ansible.builtin.service:
    name: "{{ datev_skr04_snapshot_fcgi_service_name }}"
    state: stopped
  when:
    - datev_skr04_quiesce_source | bool
    - (datev_skr04_snapshot_fcgi_service_name + '.service') in ansible_facts.services

- name: Stop the task server from its current state before snapshotting
  ansible.builtin.service:
    name: "{{ datev_skr04_snapshot_task_service_name }}"
    state: stopped
  when:
    - datev_skr04_quiesce_source | bool
    - (datev_skr04_snapshot_task_service_name + '.service') in ansible_facts.services

- name: Re-read backend state at the snapshot operation boundary
  ansible.builtin.service_facts:

- name: Require all known snapshot backends to be stopped regardless of entry state
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(datev_skr04_snapshot_fcgi_service_name + '.service', {}).get('state', '') != 'running'
      - ansible_facts.services.get(datev_skr04_snapshot_task_service_name + '.service', {}).get('state', '') != 'running'
    fail_msg: >-
      A write-capable backend is running at the snapshot operation boundary.
      Entry-state flags are preserved only for restoration; they never exempt a
      backend that became active after entry capture from being stopped now.
