---
- name: Inspect the orchestration checkout without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ playbook_dir }}"
    - "{{ playbook_dir }}/.git"
    - "{{ playbook_dir }}/scripts/kivitendo-create-dataset.pl"
    - "{{ playbook_dir }}/sql/datev-skr04-source-fingerprint.sql"
  register: datev_skr04_orchestration_path_states

- name: Require a real local Git checkout and regular privileged inputs
  ansible.builtin.assert:
    that:
      - datev_skr04_expected_orchestration_commit is match('^[0-9a-f]{40}$')
      - datev_skr04_orchestration_path_states.results[0].stat.isdir | default(false) | bool
      - not (datev_skr04_orchestration_path_states.results[0].stat.islnk | default(false) | bool)
      - datev_skr04_orchestration_path_states.results[1].stat.exists | bool
      - not (datev_skr04_orchestration_path_states.results[1].stat.islnk | default(false) | bool)
      - datev_skr04_orchestration_path_states.results[2].stat.isreg | default(false) | bool
      - not (datev_skr04_orchestration_path_states.results[2].stat.islnk | default(false) | bool)
      - datev_skr04_orchestration_path_states.results[3].stat.isreg | default(false) | bool
      - not (datev_skr04_orchestration_path_states.results[3].stat.islnk | default(false) | bool)
    fail_msg: >-
      The DATEV migration must run from a real Git checkout pinned to an explicit
      40-character reviewed commit. The helper and privileged fingerprint SQL
      must be regular files in that checkout.

- name: Read the exact orchestration Git state and privileged blob identities
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [git, -C, "{{ playbook_dir }}", rev-parse, HEAD]
    - [git, -C, "{{ playbook_dir }}", status, --porcelain=v1, --untracked-files=no]
    - [git, -C, "{{ playbook_dir }}", diff, --cached, --name-only]
    - [git, -C, "{{ playbook_dir }}", rev-parse, HEAD:scripts/kivitendo-create-dataset.pl]
    - [git, -C, "{{ playbook_dir }}", hash-object, scripts/kivitendo-create-dataset.pl]
    - [git, -C, "{{ playbook_dir }}", rev-parse, HEAD:sql/datev-skr04-source-fingerprint.sql]
    - [git, -C, "{{ playbook_dir }}", hash-object, sql/datev-skr04-source-fingerprint.sql]
    - [git, -C, "{{ playbook_dir }}", rev-parse, HEAD:datev-skr04-migration.yml]
    - [git, -C, "{{ playbook_dir }}", hash-object, datev-skr04-migration.yml]
  register: datev_skr04_orchestration_git_state
  changed_when: false

- name: Bind execution to the explicitly reviewed clean orchestration revision
  ansible.builtin.assert:
    that:
      - datev_skr04_orchestration_git_state.results | length == 9
      - datev_skr04_orchestration_git_state.results[0].stdout == datev_skr04_expected_orchestration_commit
      - datev_skr04_orchestration_git_state.results[1].stdout | trim | length == 0
      - datev_skr04_orchestration_git_state.results[2].stdout | trim | length == 0
      - datev_skr04_orchestration_git_state.results[3].stdout == datev_skr04_orchestration_git_state.results[4].stdout
      - datev_skr04_orchestration_git_state.results[5].stdout == datev_skr04_orchestration_git_state.results[6].stdout
      - datev_skr04_orchestration_git_state.results[7].stdout == datev_skr04_orchestration_git_state.results[8].stdout
    fail_msg: >-
      The local migration checkout is not the explicitly reviewed commit, has
      tracked/staged modifications, or its privileged helper/fingerprint SQL/
      playbook differs from that commit. Do not execute an unreviewed checkout.

- name: Store the verified orchestration identity for pre-create revalidation
  ansible.builtin.set_fact:
    datev_skr04_verified_orchestration_commit: >-
      {{ datev_skr04_orchestration_git_state.results[0].stdout }}
    datev_skr04_verified_helper_blob: >-
      {{ datev_skr04_orchestration_git_state.results[3].stdout }}
    datev_skr04_verified_fingerprint_sql_blob: >-
      {{ datev_skr04_orchestration_git_state.results[5].stdout }}
    datev_skr04_verified_playbook_blob: >-
      {{ datev_skr04_orchestration_git_state.results[7].stdout }}
