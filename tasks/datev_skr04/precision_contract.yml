---
- name: Validate target precision before any snapshot or target write and pin approved fiscal boundary
  ansible.builtin.assert:
    that:
      - (datev_skr04_precision | string) is match('^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$')
      - datev_skr04_precision | float > 0
      - datev_skr04_precision | float <= 1
      - datev_skr04_closed_to == '2026-07-12'
      - datev_skr04_fiscal_year_start == '2026-07-13'
    fail_msg: >-
      datev_skr04_precision must be a positive fixed-point numeric value no
      greater than 1, and the approved short fiscal-year boundary is immutable:
      source/target books must be closed through 2026-07-12 and the new fiscal
      year must start on 2026-07-13. Invalid precision or any overridden date is
      rejected before the main preflight, snapshots, native initialization,
      sidecar creation or authentication registration can run.
