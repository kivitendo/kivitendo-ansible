---
- name: Re-read backend service state after snapshot handling
  ansible.builtin.service_facts:

- name: Bind actual snapshot backend restoration status
  ansible.builtin.set_fact:
    datev_skr04_snapshot_backends_ready: >-
      {{
        (datev_skr04_snapshot_backend_restore_ready | default(false) | bool) and
        (
          (
            datev_skr04_snapshot_fcgi_was_running_at_entry | default(false) | bool and
            ansible_facts.services.get(datev_skr04_snapshot_fcgi_service_name + '.service', {}).get('state', '') == 'running'
          ) or
          (
            not (datev_skr04_snapshot_fcgi_was_running_at_entry | default(false) | bool) and
            ansible_facts.services.get(datev_skr04_snapshot_fcgi_service_name + '.service', {}).get('state', '') != 'running'
          )
        ) and
        (
          (
            datev_skr04_snapshot_task_was_running_at_entry | default(false) | bool and
            ansible_facts.services.get(datev_skr04_snapshot_task_service_name + '.service', {}).get('state', '') == 'running'
          ) or
          (
            not (datev_skr04_snapshot_task_was_running_at_entry | default(false) | bool) and
            ansible_facts.services.get(datev_skr04_snapshot_task_service_name + '.service', {}).get('state', '') != 'running'
          )
        )
      }}
