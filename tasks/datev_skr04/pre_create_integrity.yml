---
- name: Re-read live critical initialization inputs immediately before target creation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    checksum_algorithm: sha256
  loop:
    - "{{ kivitendo_install_dir }}/SL/User.pm"
    - "{{ kivitendo_install_dir }}/sql/{{ datev_skr04_target_coa }}-chart.sql"
  register: datev_skr04_critical_live_file_states_before_create

- name: Prove live initializer and chart did not change after preflight and snapshot
  ansible.builtin.assert:
    that:
      - item.state.stat.exists | bool
      - item.state.stat.isreg | default(false) | bool
      - not (item.state.stat.islnk | default(false) | bool)
      - item.state.stat.readable | default(false) | bool
      - item.state.stat.checksum == item.expected_checksum
    fail_msg: >-
      Critical live creation input {{ item.state.item }} changed, disappeared,
      became unreadable or became a symlink after preflight. Target creation is
      blocked.
  loop:
    - state: "{{ datev_skr04_critical_live_file_states_before_create.results[0] }}"
      expected_checksum: "{{ datev_skr04_live_user_pm_sha256 }}"
    - state: "{{ datev_skr04_critical_live_file_states_before_create.results[1] }}"
      expected_checksum: "{{ datev_skr04_live_skr04_chart_sha256 }}"
  loop_control:
    label: "{{ item.state.item }}"

- name: Re-read the installed kivitendo revision immediately before target creation
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ kivitendo_install_dir }}"
      - rev-parse
      - HEAD
  register: datev_skr04_installed_revision_before_create
  changed_when: false

- name: Require the pinned installed revision immediately before target creation
  ansible.builtin.assert:
    that:
      - datev_skr04_installed_revision_before_create.stdout == kivitendo_version
    fail_msg: >-
      The installed kivitendo revision changed after preflight. The target will
      not be initialized with a different or unaudited code revision.

- name: Reaudit the complete Perl override tree immediately before elevation
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [git, -C, "{{ kivitendo_install_dir }}", diff, --name-only, HEAD, --, modules/override]
    - [git, -C, "{{ kivitendo_install_dir }}", ls-files, --others, --exclude-standard, --, modules/override]
    - [git, -C, "{{ kivitendo_install_dir }}", ls-files, --others, --ignored, --exclude-standard, --, modules/override]
  register: datev_skr04_override_tree_audit_before_create
  changed_when: false

- name: Refuse override-tree drift immediately before temporary elevation
  ansible.builtin.assert:
    that:
      - item.stdout | trim | length == 0
    fail_msg: >-
      The modules/override tree changed after preflight or contains untracked or
      ignored content. Temporary PostgreSQL elevation and native target creation
      are blocked.
  loop: "{{ datev_skr04_override_tree_audit_before_create.results }}"
  loop_control:
    label: "{{ item.item | join(' ') }}"

- name: Reaudit every Perl source immediately before temporary elevation
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [git, -C, "{{ kivitendo_install_dir }}", diff, --name-only, HEAD, --, ":(glob)**/*.pm", ":(glob)**/*.pl"]
    - [git, -C, "{{ kivitendo_install_dir }}", ls-files, --others, --exclude-standard, --, ":(glob)**/*.pm", ":(glob)**/*.pl"]
    - [git, -C, "{{ kivitendo_install_dir }}", ls-files, --others, --ignored, --exclude-standard, --, ":(glob)**/*.pm", ":(glob)**/*.pl"]
  register: datev_skr04_perl_source_tree_audit_before_create
  changed_when: false

- name: Refuse Perl-source drift immediately before temporary elevation
  ansible.builtin.assert:
    that:
      - item.stdout | trim | length == 0
    fail_msg: >-
      A Perl source reachable by the native helper changed after preflight or is
      untracked/ignored. No privileged native initializer will execute.
  loop: "{{ datev_skr04_perl_source_tree_audit_before_create.results }}"
  loop_control:
    label: "{{ item.item | join(' ') }}"

- name: Reaudit every native SQL input immediately before temporary elevation
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [git, -C, "{{ kivitendo_install_dir }}", diff, --name-only, HEAD, --, sql]
    - [git, -C, "{{ kivitendo_install_dir }}", ls-files, --others, --exclude-standard, --, sql]
    - [git, -C, "{{ kivitendo_install_dir }}", ls-files, --others, --ignored, --exclude-standard, --, sql]
  register: datev_skr04_sql_source_tree_audit_before_create
  changed_when: false

- name: Refuse native SQL drift immediately before temporary elevation
  ansible.builtin.assert:
    that:
      - item.stdout | trim | length == 0
    fail_msg: >-
      A native schema or upgrade SQL input changed after preflight or is
      untracked/ignored. Temporary PostgreSQL elevation and target creation are
      blocked.
  loop: "{{ datev_skr04_sql_source_tree_audit_before_create.results }}"
  loop_control:
    label: "{{ item.item | join(' ') }}"

- name: Revalidate the persistent application-role capability set before creation
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    login_port: "{{ datev_skr04_db_port }}"
    login_db: postgres
    query: |
      SELECT
        r.rolcanlogin,
        r.rolcreatedb,
        r.rolsuper,
        r.rolcreaterole,
        r.rolreplication,
        r.rolbypassrls,
        (SELECT count(*)::bigint FROM pg_auth_members m WHERE m.member = r.oid)
          AS granted_role_memberships
      FROM pg_roles r
      WHERE r.rolname = %(db_user)s;
    named_args:
      db_user: "{{ datev_skr04_db_user }}"
  register: datev_skr04_application_role_before_create
  changed_when: false

- name: Refuse role-privilege drift immediately before target creation
  ansible.builtin.assert:
    that:
      - datev_skr04_application_role_before_create.query_result | length == 1
      - datev_skr04_application_role_before_create.query_result[0].rolcanlogin | bool
      - datev_skr04_application_role_before_create.query_result[0].rolcreatedb | bool
      - not (datev_skr04_application_role_before_create.query_result[0].rolsuper | bool)
      - not (datev_skr04_application_role_before_create.query_result[0].rolcreaterole | bool)
      - not (datev_skr04_application_role_before_create.query_result[0].rolreplication | bool)
      - not (datev_skr04_application_role_before_create.query_result[0].rolbypassrls | bool)
      - datev_skr04_application_role_before_create.query_result[0].granted_role_memberships | int == 0
    fail_msg: >-
      The persistent application role no longer has the approved LOGIN and
      CREATEDB-only capability set. No target operation is permitted.
