# Hardened Apache configuration for Debian 13 and kivitendo.
# TLS 1.2 and 1.3 only; the certificate paths are supplied by vars.yml.
<VirtualHost *:80>
    ServerName {{ kivitendo_server_name | default(inventory_hostname, true) }}
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName {{ kivitendo_server_name | default(inventory_hostname, true) }}
    ServerAdmin webmaster@localhost
    DocumentRoot {{ kivitendo_install_dir }}/public

    SSLEngine on
    SSLCertificateFile {{ ssl.cert_file }}
    SSLCertificateKeyFile {{ ssl.cert_key }}

    Protocols h2 http/1.1
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off

{% if kivitendo_hsts_enabled | bool %}
    Header always set Strict-Transport-Security "max-age=63072000"
{% endif %}
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    AddHandler         fcgid-script .fcgi
    FcgidMaxRequestLen {{ kivitendo_max_request_bytes }}
    FcgidIOTimeout     {{ kivitendo_fcgid_io_timeout }}

    AliasMatch ^/[^/]+\.pl$ {{ kivitendo_install_dir }}/fcgi/dispatcher.fcgi

    <Directory "{{ kivitendo_install_dir }}/fcgi">
        AllowOverride None
        Options +ExecCGI -Indexes
        Require all granted
    </Directory>

    <Directory "{{ kivitendo_install_dir }}/public">
        AllowOverride None
        Options -ExecCGI -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

{% if use_basic_auth | bool %}
    <Location "/">
        AuthUserFile /etc/apache2/.htpasswd
        AuthName "kivitendo"
        AuthType Basic
        Require valid-user
    </Location>
{% endif %}

    ErrorLog ${APACHE_LOG_DIR}/kivitendo-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/kivitendo-ssl-access.log combined
</VirtualHost>
