# SECURITY WARNING: This virtual host is rendered only when TLS is disabled and
# allow_insecure_http=true is explicitly set. Do not use it on untrusted networks.
<VirtualHost *:80>
    ServerName {{ kivitendo_server_name | default(inventory_hostname, true) }}
    ServerAdmin webmaster@localhost
    DocumentRoot {{ kivitendo_install_dir }}/public

    AddHandler         fcgid-script .fcgi
    FcgidMaxRequestLen {{ kivitendo_max_request_bytes }}
    FcgidIOTimeout     {{ kivitendo_fcgid_io_timeout }}

    AliasMatch ^/[^/]+\.pl$ {{ kivitendo_install_dir }}/fcgi/dispatcher.fcgi

    <Directory "{{ kivitendo_install_dir }}/fcgi">
        AllowOverride None
        Options +ExecCGI -Indexes
        Require all granted
    </Directory>

    <Directory "{{ kivitendo_install_dir }}/public">
        AllowOverride None
        Options -ExecCGI -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

{% if use_basic_auth | bool %}
    <Location "/">
        AuthUserFile /etc/apache2/.htpasswd
        AuthName "kivitendo"
        AuthType Basic
        Require valid-user
    </Location>
{% endif %}

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/kivitendo-error.log
    CustomLog ${APACHE_LOG_DIR}/kivitendo-access.log combined
</VirtualHost>
