# SECURITY WARNING: This virtual host is rendered only when TLS is disabled and
# allow_insecure_http=true is explicitly set. Do not use it on untrusted networks.
<VirtualHost *:80>
    ServerName {{ kivitendo_server_name | default(inventory_hostname, true) }}
    ServerAdmin webmaster@localhost
    DocumentRoot {{ kivitendo_install_dir }}

    AddHandler         fcgid-script .fpl
    FcgidMaxRequestLen 104857600
    FcgidIOTimeout     32000

    AliasMatch ^/[^/]+\.pl {{ kivitendo_install_dir }}/dispatcher.fpl

    <Directory "{{ kivitendo_install_dir }}">
        AllowOverride All
        Options ExecCGI Includes FollowSymLinks
        Require all granted
    </Directory>

    # Never expose source control metadata, credentials, configuration, runtime
    # files or locally stored business documents through Apache.
    <Directory "{{ kivitendo_install_dir }}/.git">
        Require all denied
    </Directory>
    <Directory "{{ kivitendo_install_dir }}/config">
        Require all denied
    </Directory>
    <Directory "{{ kivitendo_install_dir }}/kivi_documents">
        Require all denied
    </Directory>
    <Directory "{{ kivitendo_install_dir }}/users">
        Require all denied
    </Directory>
    <Directory "{{ kivitendo_install_dir }}/spool">
        Require all denied
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

{% if use_basic_auth | bool %}
    <Location "/">
        AuthUserFile /etc/apache2/.htpasswd
        AuthName "kivitendo"
        AuthType Basic
        Require valid-user
    </Location>
{% endif %}

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/kivitendo-error.log
    CustomLog ${APACHE_LOG_DIR}/kivitendo-access.log combined
</VirtualHost>
