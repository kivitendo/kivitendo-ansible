# Managed by Ansible. Optional nginx frontend for kivitendo.
# Static content is served only from the public directory. Dynamic top-level
# .pl requests are forwarded to the systemd-managed FastCGI dispatcher.

{% set effective_server_name = kivitendo_server_name | default('_', true) %}
{% if install_SSL | bool %}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name {{ effective_server_name }};

    location ^~ /.well-known/acme-challenge/ {
        root {{ kivitendo_install_dir }}/public;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name {{ effective_server_name }};

    root {{ kivitendo_install_dir }}/public;
    index index.html;
    client_max_body_size {{ kivitendo_max_request_bytes }};

    ssl_certificate /etc/nginx/kivitendo-fullchain.pem;
    ssl_certificate_key {{ effective_ssl_key_file }};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

{% if kivitendo_hsts_enabled | bool %}
    add_header Strict-Transport-Security "max-age=63072000" always;
{% endif %}
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

{% if use_basic_auth | bool %}
    auth_basic "kivitendo";
    auth_basic_user_file /etc/nginx/.htpasswd;
{% endif %}

    location ~ ^/[^/]+\.pl$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:{{ kivitendo_fastcgi_socket }};
        fastcgi_param SCRIPT_FILENAME {{ kivitendo_install_dir }}/fcgi/dispatcher.fcgi;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param DOCUMENT_ROOT {{ kivitendo_install_dir }}/public;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout {{ kivitendo_fcgid_io_timeout }}s;
        fastcgi_send_timeout {{ kivitendo_fcgid_io_timeout }}s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/kivitendo-access.log;
    error_log /var/log/nginx/kivitendo-error.log;
}
{% else %}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name {{ effective_server_name }};

    root {{ kivitendo_install_dir }}/public;
    index index.html;
    client_max_body_size {{ kivitendo_max_request_bytes }};

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

{% if use_basic_auth | bool %}
    auth_basic "kivitendo";
    auth_basic_user_file /etc/nginx/.htpasswd;
{% endif %}

    location ~ ^/[^/]+\.pl$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:{{ kivitendo_fastcgi_socket }};
        fastcgi_param SCRIPT_FILENAME {{ kivitendo_install_dir }}/fcgi/dispatcher.fcgi;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param DOCUMENT_ROOT {{ kivitendo_install_dir }}/public;
        fastcgi_read_timeout {{ kivitendo_fcgid_io_timeout }}s;
        fastcgi_send_timeout {{ kivitendo_fcgid_io_timeout }}s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/kivitendo-access.log;
    error_log /var/log/nginx/kivitendo-error.log;
}
{% endif %}
