---
- name: Prepare an isolated kivitendo SKR04 client for DATEV
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true

  vars_files:
    - vars.yml
    - datev-skr04-defaults.yml

  tasks:
    - name: Run the read-only and fail-closed preflight
      ansible.builtin.include_tasks: tasks/datev_skr04/preflight.yml
      tags:
        - always
        - preflight

    - name: Create and verify the parallel SKR04 client
      when: datev_skr04_mode == 'apply'
      block:
        - name: Capture mandatory source, auth, installation and document snapshots
          ansible.builtin.include_tasks: tasks/datev_skr04/snapshot.yml
          tags:
            - snapshot

        - name: Initialize the isolated SKR04 database
          ansible.builtin.include_tasks: tasks/datev_skr04/create.yml
          tags:
            - create

        - name: Register a quarantined non-default client without access mappings
          ansible.builtin.include_tasks: tasks/datev_skr04/register.yml
          tags:
            - register

        - name: Prove target correctness, quarantine and source immutability
          ansible.builtin.include_tasks: tasks/datev_skr04/verify.yml
          tags:
            - verify

      rescue:
        - name: Report the preserved failed apply state
          ansible.builtin.debug:
            msg:
              - "Parallel SKR04 preparation failed."
              - "Backup directory: {{ datev_skr04_backup_directory | default('not-created') }}"
              - >-
                No automatic deletion or rollback was attempted. Any partial
                target database, authentication row or sidecar contract remains
                quarantined for evidence-preserving inspection.

        - name: Terminate the failed migration without destructive cleanup
          ansible.builtin.fail:
            msg: >-
              Parallel SKR04 preparation failed and the partial state was
              preserved. Do not rerun apply or delete target resources until the
              database marker, authentication state, sidecar contract and backup
              evidence have been inspected together.

    - name: Assert that apply mode reached its guarded stopping point
      ansible.builtin.assert:
        that:
          - datev_skr04_parallel_client_ready | default(false) | bool
        fail_msg: >-
          Apply mode did not complete target verification. No cutover is allowed.
      when: datev_skr04_mode == 'apply'

    - name: Confirm that preflight made no changes
      ansible.builtin.debug:
        msg: >-
          Read-only preflight complete. No target database, auth client, posting,
          customer, invoice, default-client or task-server change was made.
      when: datev_skr04_mode == 'preflight'
