---
# Preferred: generate a fresh secrets.yml with:
#   pwsh ./scripts/New-KivitendoSecrets.ps1
# Then encrypt it with:
#   ansible-vault encrypt secrets.yml
# secrets.yml is excluded from Git.

kivitendo_admin_password: "<set-with-ansible-vault>"
kivitendo_db_password: "<set-with-ansible-vault>"
kivitendo_master_key: "<set-with-ansible-vault>"

# Only required when use_basic_auth=true in vars.yml.
# The PowerShell generator can create this section with -IncludeBasicAuth.
# basic_auth:
#   user: "example"
#   password: "<set-with-ansible-vault>"
