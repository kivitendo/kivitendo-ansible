---
name: Validate Debian 13 playbook

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-debian:
    runs-on: ubuntu-latest
    container:
      image: debian:13

    steps:
      - name: Install minimal checkout prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git
          rm -rf /var/lib/apt/lists/*

      - name: Check out exact workflow revision without third-party actions
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --depth=1 origin "${REVISION_REF}"
          git checkout --detach FETCH_HEAD

      - name: Validate bootstrap, secret generator and CSV helper syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap-debian-controller.sh
          bash -n scripts/generate-secrets.sh
          python3 -m py_compile scripts/normalize-kivitendo-csv.py

      - name: Bootstrap minimal Debian Ansible controller
        shell: bash
        run: bash scripts/bootstrap-debian-controller.sh

      - name: Generate and validate Debian secrets
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          trap 'rm -rf -- "${test_dir}"' EXIT
          output_path="${test_dir}/secrets.yml"

          bash scripts/generate-secrets.sh --output "${output_path}"

          test "$(stat -c '%a' "${output_path}")" = "600"

          .venv/bin/python - "${output_path}" <<'PYTHON'
          import re
          import sys
          from pathlib import Path

          content = Path(sys.argv[1]).read_text(encoding="utf-8")
          expected_lengths = {
              "kivitendo_admin_password": 32,
              "kivitendo_db_password": 40,
              "kivitendo_master_key": 64,
          }

          for name, expected_length in expected_lengths.items():
              match = re.search(rf"^{name}: '([A-Za-z0-9]+)'$", content, re.MULTILINE)
              if match is None:
                  raise AssertionError(f"Missing or malformed generated secret: {name}")
              if len(match.group(1)) != expected_length:
                  raise AssertionError(f"Unexpected generated length for {name}")
          PYTHON

          if bash scripts/generate-secrets.sh --output "${output_path}"; then
            echo "Secret generator overwrote an existing file without --force." >&2
            exit 1
          fi

          basic_auth_path="${test_dir}/basic-auth.yml"
          bash scripts/generate-secrets.sh \
            --output "${basic_auth_path}" \
            --include-basic-auth \
            --basic-auth-user "ci-user"
          grep -q '^basic_auth:$' "${basic_auth_path}"
          grep -q "^  user: 'ci-user'$" "${basic_auth_path}"

      - name: Normalize and validate kivitendo CSV import files
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          trap 'rm -rf -- "${test_dir}"' EXIT
          output_path="${test_dir}/kivitendo-article-import-safe.csv"

          .venv/bin/python scripts/normalize-kivitendo-csv.py \
            tests/fixtures/kivitendo-article-import.csv \
            "${output_path}"

          .venv/bin/python - "${output_path}" <<'PYTHON'
          import csv
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          if '"' in content:
              raise AssertionError("Normalized CSV must not contain double quotes")

          with path.open("r", encoding="utf-8", newline="") as handle:
              rows = list(csv.reader(handle, delimiter=";", quotechar='"', strict=True))

          if len(rows) != 2:
              raise AssertionError(f"Expected header plus one data row, got {len(rows)} rows")
          if any(len(row) != 7 for row in rows):
              raise AssertionError(f"Expected 7 columns per row, got {[len(row) for row in rows]}")
          if ";" in rows[1][6] or '"' in rows[1][6]:
              raise AssertionError("Long description was not normalized safely")
          PYTHON

      - name: Run static security validation
        shell: bash
        run: .venv/bin/python tests/validate_static.py

      - name: Validate Ansible syntax
        shell: bash
        run: |
          .venv/bin/ansible-playbook --syntax-check -i inventory main.yml
          .venv/bin/ansible-playbook --syntax-check -i inventory post-init-task-server.yml

  validate-powershell:
    runs-on: windows-latest

    steps:
      - name: Check out exact workflow revision without third-party actions
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION_REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global --add safe.directory $env:GITHUB_WORKSPACE
          git init .
          git remote add origin "https://github.com/$env:REPOSITORY.git"
          $credential = "x-access-token:$env:GITHUB_TOKEN"
          $authHeader = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credential))
          git -c "http.extraheader=AUTHORIZATION: basic $authHeader" fetch --depth=1 origin $env:REVISION_REF
          git checkout --detach FETCH_HEAD

      - name: Generate and validate cryptographic secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputPath = Join-Path $env:RUNNER_TEMP 'kivitendo-secrets.yml'
          & ./scripts/New-KivitendoSecrets.ps1 -OutputPath $outputPath

          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            throw 'Secret generator did not create the output file.'
          }

          $content = Get-Content -LiteralPath $outputPath -Raw
          $expectedLengths = [ordered]@{
            kivitendo_admin_password = 32
            kivitendo_db_password = 40
            kivitendo_master_key = 64
          }

          foreach ($entry in $expectedLengths.GetEnumerator()) {
            $name = [Regex]::Escape($entry.Key)
            $match = [Regex]::Match($content, "(?m)^${name}: '([A-Za-z0-9]+)'\r?$")
            if (-not $match.Success) {
              throw "Missing or malformed generated secret: $($entry.Key)"
            }
            if ($match.Groups[1].Value.Length -ne $entry.Value) {
              throw "Unexpected generated length for $($entry.Key)."
            }
          }

          $acl = Get-Acl -LiteralPath $outputPath
          if (-not $acl.AreAccessRulesProtected) {
            throw 'Generated secret file still inherits Windows ACL entries.'
          }

          $overwriteWasBlocked = $false
          try {
            & ./scripts/New-KivitendoSecrets.ps1 -OutputPath $outputPath
          }
          catch {
            $overwriteWasBlocked = $true
          }
          if (-not $overwriteWasBlocked) {
            throw 'Secret generator overwrote an existing file without -Force.'
          }

          Remove-Item -LiteralPath $outputPath -Force
